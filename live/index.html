<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Under Maintenance | Rooted</title>
  <style>
    :root{color-scheme:dark;--bg:#070909;--card:#101414;--line:#28302e;--green:#b8ff37;--muted:#8d9995;--text:#f5f7f6;--r:14px}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{min-height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--text);
      font:15px/1.55 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
    header{flex:0 0 auto;height:60px;padding:0 22px;border-bottom:1px solid var(--line);display:flex;align-items:center}
    .brand{color:#fff;text-decoration:none;font-weight:900;letter-spacing:.12em;font-size:15px}
    .brand span{color:var(--green);margin:0 6px}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(560px,100%);background:var(--card);border:1px solid var(--line);border-radius:var(--r);
      padding:36px 30px;text-align:center}
    .pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.06em;
      color:var(--green);border:1px solid #3a4a1e;background:#1a220c;border-radius:999px;padding:6px 13px;margin-bottom:20px}
    .pill i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.35}}
    h1{margin:0 0 12px;font-size:26px;line-height:1.2}
    p{margin:0 auto;max-width:42ch;color:var(--muted)}
    .home{display:inline-block;margin-top:26px;color:var(--green);text-decoration:none;font-weight:700}
    .home:hover{text-decoration:underline}
    footer{flex:0 0 auto;padding:12px 20px;text-align:center;color:#69736f;font-size:11px;border-top:1px solid var(--line)}
  </style>
</head>
<body>
  <header><a href="/" class="brand">ROOTED<span>×</span>DUEL</a></header>
  <main>
    <div class="card">
      <span class="pill"><i></i> MAINTENANCE</span>
      <h1>The live table is temporarily down for maintenance</h1>
      <p>We’re making some improvements and will be back shortly. Thanks for your patience.</p>
      <a href="/" class="home">← Back to Rooted</a>
    </div>
  </main>
  <footer>18+ · Entertainment only</footer>
</body>
</html>
