<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Duel Table Live | Rooted</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./wsproxy.js"></script>
  <script src="./nanoplayer.min.js"></script>
  <script src="./chat.js"></script>
</head>
<body>
  <header>
    <a href="/" class="brand">ROOTED<span>×</span>DUEL</a>
    <div class="live-pill"><i></i> LIVE TABLE 3815</div>
  </header>
  <main>
    <section class="stage" aria-label="Live Duel table feed">
      <div id="video"></div>
      <div id="videoState" class="video-state">Connecting to table feed…</div>
      <div class="audio">
        <button id="sound" type="button" title="Unmute">🔇</button>
        <input id="vol" type="range" min="0" max="100" value="80" aria-label="Volume">
      </div>
    </section>
    <aside class="side">
      <div class="auth">
        <label for="provider">Partner ID <span style="opacity:.6">(must match your token — 18772737 Duel, 333 VBET)</span></label>
        <input id="provider" class="provider" inputmode="numeric" value="18772737" autocomplete="off">
        <label for="token">Chat token</label>
        <div class="token-row">
          <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Paste hexadecimal launch token">
          <button id="connect" type="button">Connect</button>
        </div>
        <p id="authState">Watching is public. Set the Partner ID to your token's partner, paste the token, and Connect to chat as your account.</p>
      </div>
      <div id="chat" class="chat"></div>
    </aside>
  </main>
  <footer>18+ · Entertainment only · Never share your token with another person.</footer>
  <script src="./app.js"></script>
</body>
</html>
